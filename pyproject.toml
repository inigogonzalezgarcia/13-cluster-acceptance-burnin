[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-acceptance-burnin"
version = "0.1.0"
description = "Acceptance testing for a new GPU cluster: staged validation, burn-in, punch list and a report for the customer"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
accept = "acceptance.cli:main"

[tool.setuptools]
packages = ["acceptance"]
